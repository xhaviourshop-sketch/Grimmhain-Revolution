<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Tablet shell: cover the full screen incl. notch areas; disable user
         zoom (board scaling is app-controlled, not page-controlled). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Cinzel Decorative for the ornate menu/quit labels. NOTE: CDN font —
         self-host for the offline Capacitor build later. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <!-- favicon: served from the sync-legacy asset bundle (see scripts/sync-legacy.mjs) -->
    <link rel="icon" type="image/png" href="/legacy-setup/assets/icons/app/icon-192.png" />
    <title>Grimmhain – React Shell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
