<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #c5cddb;
	background-color: #060810; /* Farbe des Ladebilds: kein weisses oder schwarzes Aufblitzen */
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* Ladebild (ladebild.webp, 3:2) als Hintergrund, per cover beschnitten; Siegel und Wortmarke darüber, die Mitte leicht abgedunkelt.
   Fehlt das Bild, bleibt das Startbild von Godot (#status-splash) wie bisher. */
#status.has-ladebild {
	background-color: #060810;
	background-image: radial-gradient(ellipse at center, rgba(6, 8, 16, 0.55) 0%, rgba(6, 8, 16, 0) 70%), url('ladebild.webp');
	background-size: cover, cover;
	background-position: center, center;
	background-repeat: no-repeat;
}

#status.has-ladebild #status-splash {
	display: none;
}

#status-brand {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 2.5vh;
	margin-bottom: 8vh;
	pointer-events: none;
}

#status.has-ladebild #status-brand {
	display: flex;
}

#status-brand img {
	display: block;
	max-width: 80vw;
	height: auto;
}

#status-brand .siegel {
	width: min(24vh, 30vw);
}

#status-brand .wortmarke {
	width: min(58vh, 70vw);
}

/* Schmaler Ladebalken in Mondsilber (Grimmhain) */
#status-progress {
	bottom: 11%;
	width: 36%;
	max-width: 420px;
	height: 3px;
	margin: 0 auto;
	appearance: none;
	-webkit-appearance: none;
	border: 0;
	border-radius: 2px;
	background-color: rgba(197, 205, 219, 0.18);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background-color: rgba(197, 205, 219, 0.18);
}

#status-progress::-webkit-progress-value {
	background-color: #c5cddb;
	border-radius: 2px;
}

#status-progress::-moz-progress-bar {
	background-color: #c5cddb;
	border-radius: 2px;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-brand">
				<img class="siegel" src="siegel.webp" alt="" onerror="this.style.display='none'">
				<img class="wortmarke" src="wortmarke.webp" alt="" onerror="this.style.display='none'">
			</div>
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Ladebild: liegt ladebild.webp neben der Seite (godot/web/ladebild.webp, kopiert vom Export), wird es Hintergrund der Ladeseite; sonst bleibt alles wie bisher.
(function () {
	const probe = new Image();
	probe.onload = function () { document.getElementById('status').classList.add('has-ladebild'); };
	probe.src = 'ladebild.webp';
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Erzwungenes Update: Vor dem Start der Engine wird geprüft, ob die Seite wirklich den neuesten Build zeigt. Zwei Fälle verwerfen alle Service
// Worker und Caches und laden einmal neu: (1) `version.json` (Netzwerk, nie Cache) nennt einen anderen Build als diese Seite, (2) im Browser liegt
// ein Cache eines anderen Builds, also ein alter Service Worker, der sonst alte Engine-Dateien zur neuen Seite liefern würde (Browser prüfen
// Service Worker nur alle 24 Stunden von selbst). Pro Zielstand nur ein Versuch, keine Schleife. Offline oder bei Zeitüberschreitung startet die App
// mit dem vorhandenen Stand. `tools/export-web.js` setzt die Kennung; der Cache-Name des Service Workers ist 'grimmhain-' + Kennung.
const freshCheck = (async function () {
	const BUILD_ID = '___BUILD_ID___';
	if (BUILD_ID.indexOf('___') === 0 || !window.fetch) {
		return true;
	}
	try {
		const ctrl = new AbortController();
		const timer = setTimeout(() => ctrl.abort(), 4000);
		const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
		clearTimeout(timer);
		const v = r.ok ? await r.json() : null;
		if (!v || !v.id) {
			return true;
		}
		const keys = window.caches ? await caches.keys() : [];
		const staleCache = keys.some((key) => key !== 'grimmhain-' + BUILD_ID);
		if (v.id === BUILD_ID && !staleCache) {
			return true;
		}
		let tried = '';
		try { tried = sessionStorage.getItem('grimmhain-update-tried') || ''; } catch (e) { /* ignore */ }
		if (tried === v.id) {
			return true; // eine Schleife vermeiden: pro Zielstand nur ein Versuch
		}
		try { sessionStorage.setItem('grimmhain-update-tried', v.id); } catch (e) { /* ignore */ }
		if (navigator.serviceWorker) {
			const regs = await navigator.serviceWorker.getRegistrations();
			await Promise.all(regs.map((reg) => reg.unregister()));
		}
		await Promise.all(keys.map((key) => caches.delete(key)));
		location.reload();
		return false;
	} catch (e) {
		return true; // offline: weiter mit dem vorhandenen Stand
	}
})();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		freshCheck.then((proceed) => {
			if (!proceed) {
				return; // die Seite lädt gerade neu
			}
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		});
	}
}());
		</script>
	</body>
</html>
